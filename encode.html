<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QRCode File Transfer</title>
</head>
<body>
<div style="margin: .5em 0">
    <div style="display: inline-block">File: <input type="file" id="file-selector"></div>
    <div style="display: inline-block; margin-right: 2em">Speed: <input type="text" id="speed" value="100" style="width: 4em"> ms.</div>
    <div style="display: inline-block; margin-right: 2em">Progress: <input type="number" id="current-block-index" value="0" style="width: 6em"> / <span id="all-block-count">100</span>.</div>
    <div style="display: inline-block; margin-right: 2em"><input type="button" value="Start" id="start-button"></div>
    <div style="display: inline-block">Screen awake: <span id="wake-lock-status">-</span></div>
</div>
<div style="margin: .5em 0">
    <div style="display: inline-block; margin-right: 2em">QR version: <input type="number" id="qrcode-version" value="27" min="1" max="40" step="1" style="width: 4em">
        (<span id="qrcode-size">-</span> modules)</div>
    <div style="display: inline-block; margin-right: 2em">Error correction:
        <select id="error-correction-level">
            <option value="L" selected>L (7%)</option>
            <option value="M">M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
        </select></div>
    <div style="display: inline-block">Block size: <span id="block-size">-</span> bytes</div>
</div>
<div style="margin: .5em 0">
    <div style="display: inline-block; margin-right: 2em">Blocks: <input type="text" id="block-list" placeholder="empty = all (e.g. 3,7,10-15)" style="width: 20em"></div>
    <div style="display: inline-block">Repeat file info every <input type="number" id="repeat-file-info" value="0" min="0" style="width: 4em"> blocks (0 = off).</div>
</div>
<div id="progress-bar" style="width: 100%; height: 1.5em"></div>
<img alt="qrcode" id="qrcode" style="display: block; width: 40em; height: 40em; border: 1px solid #eee; image-rendering: pixelated">
<script src="js/qrcode.js"></script>
<script src="js/wake-lock.js"></script>
<script src="js/encode.js"></script>
</body>
</html>
